# 玉阳洞天游园 · nginx 站点配置示例
# 把 yuyang.example.com 换成你的域名，root 换成你上传的目录。
# HTTPS 证书用 certbot 自动申请：sudo certbot --nginx -d yuyang.example.com

server {
    listen 80;
    listen [::]:80;
    server_name yuyang.example.com;

    root /var/www/yuyang;
    index index.html;
    charset utf-8;

    # 压缩文本类文件（js、css、观音头像数据 txt 等），图片和字体本身已压缩
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # 页面和代码：每次回源校验，更新后访客马上看到新版
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /js/          { add_header Cache-Control "no-cache"; }

    # 贴图、画作照片、字体、three.js：长缓存
    location ~* ^/(assets|fonts|vendor)/ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location = /cover.jpg { add_header Cache-Control "public, max-age=86400"; }

    # 不对外暴露隐藏文件和说明文件
    location ~ /\.            { deny all; }
    location ~* \.(md|conf)$  { deny all; }

    location / { try_files $uri $uri/ =404; }
}
